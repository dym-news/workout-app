<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>추천 규칙 검사</title>
  <link rel="stylesheet" href="css/design.css">
  <style>
    table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    th, td { border-bottom: 1px solid var(--line); padding: var(--sp-2); text-align: left; vertical-align: top; }
    th { color: var(--text-muted); font-weight: 600; }
    .pass { color: var(--success); font-weight: 700; }
    .fail { color: var(--danger); font-weight: 700; }
    .wrap { max-width: 980px; margin: 0 auto; padding: var(--sp-4); overflow-x: auto; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>추천 규칙 검사</h1>
  <p class="muted">앱의 실제 계산 코드(js/logic.js)에 예시를 넣어 설계서 표와 같은 답이 나오는지 확인합니다.</p>
  <div id="summary"></div>
  <h2>1. 난이도 평가 → 다음 추천 (설계서 4-6)</h2>
  <div class="card"><table id="t-rec"></table></div>
  <h2>2. 주간 루틴 분할 (설계서 4-2)</h2>
  <div class="card"><table id="t-split"></table></div>
  <h2>3. 목표 점검 (설계서 4-1)</h2>
  <div class="card"><table id="t-goal"></table></div>
  <h2>4. MET·칼로리 배분</h2>
  <div class="card"><table id="t-kcal"></table></div>
  <h2>5. 무게 단위·휴식 시간</h2>
  <div class="card"><table id="t-step"></table></div>
  <h2>6. 인바디 판정</h2>
  <div class="card"><table id="t-body"></table></div>
  <h2>7. 새 운동·코스 개편</h2>
  <div class="card"><table id="t-new"></table></div>
</div>
<script src="js/exercises.js"></script>
<script src="js/figures.js"></script>
<script src="js/muscles.js"></script>
<script src="js/logic.js"></script>
<script>
  const R = Logic.rules({});
  let pass = 0, total = 0;
  const mark = ok => { total++; if (ok) pass++; return ok ? '<span class="pass">통과</span>' : '<span class="fail">틀림</span>'; };
  const sets = (w, reps) => reps.map(r => ({ w, r, done: true }));
  const show = (ex, x) => Logic.isWeighted(ex) ? `${x.weight}kg × ${x.reps}회` : `${x.reps}회`;

  // ---- 1. 다음 추천 ----
  const cases = [
    { title: '여유(RPE 6 이하) + 모든 세트 상한 달성', ex: 'bench', level: 'intermediate', rec: { weight: 60, reps: 12 }, reps: [12, 12, 12, 12], rating: 'easy',
      rule: '상한(12회) 모두 채움 → 중량 증가(상체 +2.5kg), 횟수는 하한(8회)으로', expect: { weight: 62.5, reps: 8 } },
    { title: '여유 + 상한 못 채움', ex: 'bench', level: 'intermediate', rec: { weight: 60, reps: 10 }, reps: [12, 11, 10, 10], rating: 'easy',
      rule: '횟수 +2 (상한 12회를 넘지 않음)', expect: { weight: 60, reps: 12 } },
    { title: '적정(RPE 7~8) + 상한 도달 (하체 바벨)', ex: 'squat', level: 'beginner', rec: { weight: 40, reps: 15 }, reps: [15, 15, 15], rating: 'ok',
      rule: '상한(15회) 도달 → 중량 증가(하체 +5kg), 횟수 하한(10회)', expect: { weight: 45, reps: 10 } },
    { title: '적정 + 상한 전', ex: 'chest_press', level: 'intermediate', rec: { weight: 30, reps: 11 }, reps: [11, 11, 11, 11], rating: 'ok',
      rule: '횟수 +1', expect: { weight: 30, reps: 12 } },
    { title: '한계 근접(RPE 9~10) 3회 연속 (머신)', ex: 'lat_pulldown', level: 'intermediate', rec: { weight: 40, reps: 10, hardStreak: 2 }, reps: [10, 10, 9], rating: 'hard',
      rule: '같은 중량·횟수 유지, 3회 연속이면 10% 감소 제안 (40 × 0.9 = 36kg)', expect: { weight: 40, reps: 10, suggestDrop: true, dropTo: 36 } },
    { title: '목표 미달 (덤벨)', ex: 'db_shoulder', level: 'intermediate', rec: { weight: 14, reps: 9 }, reps: [9, 7, 6], rating: 'fail',
      rule: '중량 10% 감소 (14 × 0.9 = 12.6 → 1kg 단위로 내림 = 12kg)', expect: { weight: 12, reps: 9 } },
    { title: '맨손 운동 여유', ex: 'pushup', level: 'beginner', rec: { weight: 0, reps: 15 }, reps: [15, 15, 15], rating: 'easy',
      rule: '맨손 운동은 횟수만 올림 (+2)', expect: { weight: 0, reps: 17 } },
    { title: '목표 미달 (머신 15kg)', ex: 'chest_press', level: 'intermediate', rec: { weight: 15, reps: 10 }, reps: [10, 8, 6], rating: 'fail',
      rule: '10% 감소: 15 × 0.9 = 13.5 → 1kg 단위로 내림 = 13kg (5kg 칸으로 내려 10kg가 되면 안 됨)', expect: { weight: 13, reps: 10 } },
    { title: '목표 미달 (바벨 60kg)', ex: 'bench', level: 'intermediate', rec: { weight: 60, reps: 8 }, reps: [8, 6, 5], rating: 'fail',
      rule: '10% 감소: 60 × 0.9 = 54 → 바벨 2.5kg 단위로 내림 = 52.5kg', expect: { weight: 52.5, reps: 8 } },
  ];
  let h = '<tr><th>#</th><th>예시</th><th>이번 추천 / 실제 기록</th><th>평가</th><th>설계서 규칙</th><th>기대 결과</th><th>계산 결과</th><th>결과</th></tr>';
  cases.forEach((c, i) => {
    const ex = EX[c.ex];
    const presc = Logic.prescription(ex, c.level, R);
    const out = Logic.nextRec(ex, Object.assign({ hardStreak: 0 }, c.rec), sets(c.rec.weight, c.reps), c.rating, presc, R);
    let ok = out.weight === c.expect.weight && out.reps === c.expect.reps;
    if (c.expect.suggestDrop) ok = ok && out.suggestDrop && out.dropTo === c.expect.dropTo;
    h += `<tr><td>${i + 1}</td><td><b>${c.title}</b><br><span class="muted">${ex.name} · ${LEVELS[c.level]} (${presc.lo}~${presc.hi}회)</span></td>
      <td>${show(ex, c.rec)}<br><span class="muted">${c.reps.join(', ')}회</span></td><td>${RATINGS[c.rating]}</td><td>${c.rule}</td>
      <td>${show(ex, c.expect)}${c.expect.suggestDrop ? `<br>감소 제안 ${c.expect.dropTo}kg` : ''}</td>
      <td>${show(ex, out)}${out.suggestDrop ? `<br>감소 제안 ${out.dropTo}kg` : ''}<br><span class="muted">${out.note}</span></td><td>${mark(ok)}</td></tr>`;
  });
  document.getElementById('t-rec').innerHTML = h;

  // ---- 2. 분할 ----
  const name = k => Logic.DAYS[k].name;
  const splits = [
    [2, 'beginner', '전신A → 전신B'],
    [3, 'beginner', '전신A → 전신B → 전신A'],
    [3, 'intermediate', '상체 → 하체 → 전신'],
    [4, 'intermediate', '상체A (어깨·등) → 하체A (앞쪽) → 상체B (가슴·팔) → 하체B (뒤쪽)'],
    [5, 'intermediate', '상체1 (어깨·등) → 하체1 (앞쪽) → 상체2 (가슴·등) → 하체2 (뒤쪽) → 상체3 (가슴·팔)'],
    [6, 'advanced', '상체ㄱ (어깨·등) → 하체ㄱ (앞쪽) → 상체ㄴ (가슴·등) → 하체ㄴ (뒤쪽) → 상체ㄷ (가슴·팔) → 하체ㄷ (종합)'],
  ];
  h = '<tr><th>주 횟수</th><th>수준</th><th>기대</th><th>계산 결과</th><th>결과</th></tr>';
  splits.forEach(([f, lv, exp]) => {
    const got = Logic.weekPlan(f, lv, 0).map(name).join(' → ');
    h += `<tr><td>${f}회</td><td>${LEVELS[lv]}</td><td>${exp}</td><td>${got}</td><td>${mark(got === exp)}</td></tr>`;
  });
  const w2 = Logic.weekPlan(5, 'intermediate', 5).map(k => name(k).split(' ')[0]).join(' → ');
  h += `<tr><td>5회 (다음 주)</td><td>중급</td><td>매주 상체1부터 같은 순서</td><td>${w2}</td><td>${mark(w2.startsWith('상체1'))}</td></tr>`;
  // 연달아 오는 날(한 바퀴 돌아 처음으로 이어지는 경우 포함)에 겹치는 부위가 없는지, 가슴·등이 주 2회인지
  const groupsOf = k => new Set(Logic.dayExercises(k, 'intermediate').map(id => EX[id].group));
  [4, 5, 6].forEach(f => {
    const c = Logic.cycle(f, 'intermediate');
    const clash = [];
    c.forEach((k, i) => { const n = c[(i + 1) % c.length]; const a = groupsOf(k), b = groupsOf(n); const both = [...a].filter(x => b.has(x)); if (both.length) clash.push(`${name(k).split(' ')[0]}→${name(n).split(' ')[0]}: ${both.join(',')}`); });
    h += `<tr><td>${f}회</td><td>연속한 날</td><td>바로 이어지는 두 날에 같은 부위 없음</td><td>${clash.join(' / ') || '겹침 없음'}</td><td>${mark(!clash.length)}</td></tr>`;
    const cnt = g => c.filter(k => Logic.DAYS[k].area.includes('upper') && groupsOf(k).has(g)).length;
    if (f >= 5) h += `<tr><td>${f}회</td><td>주간 횟수</td><td>가슴·등 주 2회 이상</td><td>가슴 ${cnt('chest')}회 · 등 ${cnt('back')}회</td><td>${mark(cnt('chest') >= 2 && cnt('back') >= 2)}</td></tr>`;
  });
  document.getElementById('t-split').innerHTML = h;

  // ---- 3. 목표 점검 ----
  const goals = [
    [{ height: 175, weight: 80, target: 72, weeks: 12, sex: 'male', age: 40, freq: 4 }, false, '주당 0.67kg = 0.83% → 경고 없음'],
    [{ height: 175, weight: 80, target: 72, weeks: 6, sex: 'male', age: 40, freq: 4 }, true, '주당 1.33kg = 1.67% → 1% 초과 경고'],
    [{ height: 165, weight: 55, target: 60, weeks: 10, sex: 'female', age: 30, freq: 3 }, true, '증량 주당 0.5kg = 0.91% → 0.5% 초과 경고'],
  ];
  h = '<tr><th>입력</th><th>설계서 기준</th><th>계산 결과</th><th>결과</th></tr>';
  goals.forEach(([p, warn, why]) => {
    const g = Logic.goalCheck(p, R);
    h += `<tr><td>${p.weight}→${p.target}kg, ${p.weeks}주</td><td>${why}</td><td>주당 ${g.weekly}kg (${g.pct}%) · 경고 ${g.warn ? '있음' : '없음'}<br><span class="muted">기초대사량 ${g.bmr}kcal</span></td><td>${mark(g.warn === warn)}</td></tr>`;
  });
  const b = Logic.bmr({ weight: 80, height: 175, age: 40, sex: 'male' });
  h += `<tr><td>남 80kg·175cm·40세</td><td>10×80 + 6.25×175 − 5×40 + 5 = 1698.75</td><td>${b}</td><td>${mark(Math.abs(b - 1698.75) < 0.01)}</td></tr>`;
  document.getElementById('t-goal').innerHTML = h;

  // ---- 4. MET·칼로리 배분 ----
  const near = (a, b, tol = 0.15) => Math.abs(a - b) <= tol;
  h = '<tr><th>항목</th><th>기준</th><th>기대값</th><th>계산 결과</th><th>결과</th></tr>';
  const tm = Logic.acsmTreadmill(5.5, 10);
  h += `<tr><td>트레드밀 시속 5.5km · 경사 10%</td><td>ACSM 걷기: 3.5 + 0.1×S + 1.8×S×경사 (S=분당 m)</td><td>약 8.3</td><td>${tm.met}</td><td>${mark(near(tm.met, 8.3))}</td></tr>`;
  const tr = Logic.acsmTreadmill(8, 1);
  h += `<tr><td>트레드밀 시속 8km · 경사 1%</td><td>ACSM 달리기: 3.5 + 0.2×S + 0.9×S×경사</td><td>약 9.0</td><td>${tr.met}</td><td>${mark(near(tr.met, 9.0))}</td></tr>`;
  const bk = Logic.acsmBike(100, 80);
  h += `<tr><td>자전거 100W · 80kg</td><td>ACSM: (7 + 1.8×W×6.12÷체중) ÷ 3.5 / Compendium 90~100W = 6.0</td><td>약 5.9</td><td>${bk.met}</td><td>${mark(near(bk.met, 5.9))}</td></tr>`;
  const s1 = Logic.strengthMET(EX.leg_ext, 'ok', 20), s2 = Logic.strengthMET(EX.squat, 'ok', 40), s3 = Logic.strengthMET(EX.bench, 'hard', 60);
  h += `<tr><td>레그 익스텐션 · 적정</td><td>Compendium 02054</td><td>3.5</td><td>${s1.met}</td><td>${mark(s1.met === 3.5)}</td></tr>`;
  h += `<tr><td>스쿼트 · 적정</td><td>Compendium 02052</td><td>5.0</td><td>${s2.met}</td><td>${mark(s2.met === 5.0)}</td></tr>`;
  h += `<tr><td>벤치프레스 · 한계 근접</td><td>Compendium 02050 (고강도)</td><td>6.0</td><td>${s3.met}</td><td>${mark(s3.met === 6.0)}</td></tr>`;
  const P = { height: 175, weight: 80, target: 72, weeks: 12, sex: 'male', age: 40, freq: 4, level: 'intermediate', minutes: 60 };
  const gg = Logic.goalCheck(P, R);
  h += `<tr><td>하루 배분 (80→72kg, 12주, 주 4회)</td><td>하루 적자 733 = 운동 30% 220 + 식단 513 / 1회 목표 220×7÷4</td><td>운동 220 · 식단 513 · 1회 385 · 섭취 약 1,525</td>
    <td>운동 ${gg.exerciseDaily} · 식단 ${gg.dietDeficit} · 1회 ${gg.sessionTarget} · 섭취 ${gg.intake}</td><td>${mark(gg.exerciseDaily === 220 && gg.dietDeficit === 513 && gg.sessionTarget === 385 && Math.abs(gg.intake - 1525) <= 1)}</td></tr>`;
  const sp = Logic.sessionPlan({ profile: P, dayKey: 'UA' });
  h += `<tr><td>60분 · 중급 상체A (근력 6개)</td><td>감량 중 시간이 모자라면 작은 운동 세트부터 줄여 유산소 ${R.cardioMinMinutes}분 이상 확보</td><td>유산소 ≥ ${R.cardioMinMinutes}분, 총 ≤ 60분</td>
    <td>유산소 ${sp.cardio.minutes}분 · 총 ${sp.totalMin}분<br><span class="muted">${sp.trims.join(', ') || '줄인 것 없음'}</span></td><td>${mark(!sp.cardio.skip && sp.cardio.minutes >= R.cardioMinMinutes && sp.totalMin <= 60)}</td></tr>`;
  const sk = Logic.sessionPlan({ profile: Object.assign({}, P, { target: 80 }), dayKey: 'UA' });
  h += `<tr><td>같은 조건 · 체중 유지 목표</td><td>유지·증량은 근력을 줄이지 않음(설계서 4-7: 15분 미만이면 다음 날)</td><td>줄인 것 없음</td><td>${sk.trims.length ? sk.trims.join(', ') : '줄인 것 없음'} · 유산소 ${sk.cardio.skip ? '다음 날' : sk.cardio.minutes + '분'}</td><td>${mark(sk.trims.length === 0)}</td></tr>`;
  document.getElementById('t-kcal').innerHTML = h;

  // ---- 5. 무게 단위·휴식 ----
  h = '<tr><th>항목</th><th>기대</th><th>계산 결과</th><th>결과</th></tr>';
  const db = EX.hammer_curl, mc = EX.chest_press, bb = EX.bench;
  const st = (ex, w, d) => Logic.weightStep(ex, w, d, R);
  [[db, 2, 1, 3, '덤벨 2kg +'], [db, 19, 1, 20, '덤벨 19kg +'], [db, 20, 1, 22.5, '덤벨 20kg + (2.5 단위로)'], [db, 22.5, -1, 20, '덤벨 22.5kg −'],
   [db, 14.6, 1, 15, '덤벨 14.6kg + (눈금에 맞춤)'], [db, 14.6, -1, 14, '덤벨 14.6kg −'], [mc, 14.6, 1, 15, '머신 14.6kg +'], [bb, 61, 1, 62.5, '바벨 61kg +']]
    .forEach(([ex, w, d, exp, t]) => { const got = st(ex, w, d); h += `<tr><td>${t}</td><td>${exp}kg</td><td>${got}kg</td><td>${mark(got === exp)}</td></tr>`; });
  const dbUp = Logic.nextRec(db, { weight: 8, reps: 15 }, sets(8, [15, 15]), 'easy', Logic.prescription(db, 'beginner', R), R);
  h += `<tr><td>덤벨 8kg 상한 달성 → 다음 무게</td><td>9kg (1kg 단위)</td><td>${dbUp.weight}kg</td><td>${mark(dbUp.weight === 9)}</td></tr>`;
  const rests = ['beginner', 'intermediate', 'advanced'].map(lv => [lv, Logic.prescription(EX.squat, lv, R).rest, Logic.prescription(EX.side_lateral, lv, R).rest]);
  h += `<tr><td>휴식(초) 큰/작은 운동</td><td>초보 60/60 · 중급 60/60 · 상급 120/60</td><td>${rests.map(r => `${LEVELS[r[0]]} ${r[1]}/${r[2]}`).join(' · ')}</td>
    <td>${mark(rests[0][1] === 60 && rests[0][2] === 60 && rests[1][1] === 60 && rests[1][2] === 60 && rests[2][1] === 120 && rests[2][2] === 60)}</td></tr>`;
  document.getElementById('t-step').innerHTML = h;

  // ---- 6. 인바디 판정 ----
  h = '<tr><th>입력</th><th>기준</th><th>기대</th><th>계산 결과</th><th>결과</th></tr>';
  const man = { sex: 'male', height: 175, weight: 80 }, woman = { sex: 'female', height: 160, weight: 60 };
  const pick = (a, k) => a.items.find(x => x.key === k);
  const A1 = Logic.bodyAssess({ weight: 80, fatPct: 26, visceral: 11, waist: 92, whr: 0.93, ecw: 0.392 }, man, null);
  const chk = (a, k, lv, label, std) => { const x = pick(a, k); h += `<tr><td>${label}</td><td>${std}</td><td>${lv}</td><td>${x.value} → ${x.status} (${x.level})</td><td>${mark(x.level === lv)}</td></tr>`; };
  chk(A1, 'bmi', 'bad', '남 175cm 80kg BMI', '25 이상 비만 (대한비만학회)');
  chk(A1, 'fatPct', 'bad', '남 체지방률 26%', '표준 10~20%, 25% 이상 비만');
  chk(A1, 'visceral', 'caution', '내장지방 레벨 11', '10 미만 권장 (InBody)');
  chk(A1, 'waist', 'bad', '남 허리둘레 92cm', '90cm 이상 복부비만');
  chk(A1, 'whr', 'bad', '남 복부지방률 0.93', '0.90 이상 (WHO)');
  chk(A1, 'ecw', 'bad', '세포외수분비 0.392', '0.390 넘으면 부종 가능 (InBody)');
  const A2 = Logic.bodyAssess({ weight: 55, fatPct: 24, tbw: 27 }, woman, null);
  chk(A2, 'bmi', 'good', '여 160cm 55kg BMI', '18.5~22.9 정상');
  chk(A2, 'fatPct', 'good', '여 체지방률 24%', '표준 18~28%');
  chk(A2, 'tbw', 'caution', '체수분 27L (제지방 41.8kg)', '제지방의 약 73%가 적정 → 65%면 부족');
  const A3 = Logic.bodyAssess({ weight: 79, smm: 33.0 }, man, { smm: 33.6 });
  chk(A3, 'smm', 'caution', '골격근량 33.6 → 33.0kg', '지난번보다 0.3kg 넘게 줄면 주의');
  h += `<tr><td>조언 문구</td><td>체지방·수분 등 판정에 맞는 조언</td><td>있음</td><td>${A1.advice.length}개 · 물 ${A1.water[0]}~${A1.water[1]}L</td><td>${mark(A1.advice.length >= 3 && A1.water[0] === 2.4)}</td></tr>`;
  const gB = Logic.goalCheck(Object.assign({}, { height: 175, weight: 80, target: 72, weeks: 12, sex: 'male', age: 40, freq: 4, minutes: 60 }, { bmrMeasured: 1800 }), R);
  h += `<tr><td>인바디 기초대사량 1800 입력</td><td>공식 대신 측정값 사용</td><td>1800</td><td>${gB.bmr}</td><td>${mark(gB.bmr === 1800)}</td></tr>`;
  document.getElementById('t-body').innerHTML = h;

  // ---- 7. 2단계: 새 운동·코스 개편·운동 추가 ----
  h = '<tr><th>항목</th><th>기대</th><th>계산 결과</th><th>결과</th></tr>';
  const strength = EXERCISES.filter(e => !e.cardio);
  const noFig = strength.filter(e => !FIG.has(e.id)).map(e => e.name), noMus = EXERCISES.filter(e => !MUSCLE.MAP[e.id]).map(e => e.name);
  const badAlt = EXERCISES.filter(e => e.alts.some(a => !EX[a])).map(e => e.name);
  h += `<tr><td>근력 운동 수</td><td>60개 (1차 31 + 추가 18 + 기구 변형 11)</td><td>${strength.length}개</td><td>${mark(strength.length === 60)}</td></tr>`;
  h += `<tr><td>모든 운동에 그림·근육 그림·대체 운동</td><td>빠진 것 없음</td><td>${[...noFig, ...noMus, ...badAlt].join(', ') || '빠진 것 없음'}</td><td>${mark(!noFig.length && !noMus.length && !badAlt.length)}</td></tr>`;
  [4, 5, 6].forEach(f => {
    const v = Logic.weekVolume(f, 'intermediate', R);
    const ok = ['가슴', '등', '허벅지 앞'].every(k => v[k] >= 10 && v[k] <= 24) && v['어깨'] >= 8 && v['엉덩이·허벅지 뒤'] >= 10;
    h += `<tr><td>주 ${f}회 중급 주간 세트</td><td>가슴·등·허벅지 앞 10~24, 어깨 8+, 엉덩이·허벅지 뒤 10+</td><td>${Object.entries(v).map(([k, n]) => `${k} ${n}`).join(' · ')}</td><td>${mark(ok)}</td></tr>`;
  });
  const orderOk = Object.keys(Logic.DAYS).every(k => { const l = Logic.dayExercises(k, 'intermediate'); const firstSmall = l.findIndex(id => !EX[id].big); return firstSmall < 0 || l.slice(firstSmall).every(id => !EX[id].big); });
  h += `<tr><td>운동 순서</td><td>모든 코스: 큰 운동 → 작은 운동 → 복부</td><td>${orderOk ? '지켜짐' : '어긋남'}</td><td>${mark(orderOk)}</td></tr>`;
  const withAdd = Logic.dayExercises('LB', 'intermediate', {}, { LB: ['hip_abduction', 'side_plank'] });
  const expAdd = ['rdl', 'hip_thrust', 'bulgarian', 'leg_curl', 'hip_abduction', 'cable_crunch', 'side_plank'];
  h += `<tr><td>하체B에 힙 어브덕션·사이드 플랭크 추가</td><td>복부 운동 앞에 근력, 복부는 맨 뒤</td><td>${withAdd.map(id => EX[id].name).join(' → ')}</td><td>${mark(JSON.stringify(withAdd) === JSON.stringify(expAdd))}</td></tr>`;
  const spAdd = Logic.sessionPlan({ profile: { height: 175, weight: 80, target: 80, weeks: 12, sex: 'male', age: 40, freq: 4, level: 'intermediate', minutes: 90 }, dayKey: 'LB', adds: { LB: ['hip_abduction'] } });
  h += `<tr><td>추가한 운동이 오늘 계획에 들어감</td><td>힙 어브덕션 포함</td><td>${spAdd.items.map(i => EX[i.id].name).join(', ')}</td><td>${mark(spAdd.items.some(i => i.id === 'hip_abduction'))}</td></tr>`;
  // 주마다 기구 변형
  const lb0 = Logic.dayExercises('LB', 'intermediate', {}, {}, 0), lb1 = Logic.dayExercises('LB', 'intermediate', {}, {}, 1), lb2 = Logic.dayExercises('LB', 'intermediate', {}, {}, 2);
  h += `<tr><td>하체B 레그 컬 주마다</td><td>누워서 → 앉아서 → 누워서</td><td>${[lb0, lb1, lb2].map(l => EX[l.find(id => /leg_curl/.test(id))].name).join(' → ')}</td><td>${mark(lb0.includes('leg_curl') && lb1.includes('seated_leg_curl') && lb2.includes('leg_curl'))}</td></tr>`;
  const la0 = Logic.dayExercises('LA', 'intermediate', {}, {}, 0), la1 = Logic.dayExercises('LA', 'intermediate', {}, {}, 1);
  h += `<tr><td>하체A 레그프레스 주마다</td><td>앉아서 → 45도</td><td>${[la0, la1].map(l => EX[l.find(id => /leg_press$/.test(id))].name).join(' → ')}</td><td>${mark(la0.includes('leg_press') && la1.includes('incline_leg_press'))}</td></tr>`;
  const fa0 = Logic.dayExercises('FA', 'intermediate', {}, {}, 0), fa1 = Logic.dayExercises('FA', 'intermediate', {}, {}, 1);
  const bigOk = fa0.includes('squat') && fa1.includes('smith_squat') && fa0.includes('bench') && fa1.includes('db_bench');
  h += `<tr><td>큰 운동도 주마다</td><td>스쿼트 봉 자유↔스미스, 벤치 바벨↔덤벨</td><td>${[fa0, fa1].map(l => l.slice(0, 2).map(id => EX[id].name).join('·')).join(' → ')}</td><td>${mark(bigOk)}</td></tr>`;
  const hol = Logic.HOLIDAYS['2026-09-25'] === '추석' && Logic.HOLIDAYS['2027-02-09'] === '대체공휴일' && !Logic.HOLIDAYS['2026-11-25'];
  h += `<tr><td>공휴일 표</td><td>2026 추석·2027 설 대체공휴일 있음</td><td>${Object.keys(Logic.HOLIDAYS).length}일</td><td>${mark(hol)}</td></tr>`;
  let dup = [];
  for (let wk = 0; wk < 6; wk++) Object.keys(Logic.DAYS).forEach(k => { const l = Logic.dayExercises(k, 'intermediate', {}, {}, wk); if (new Set(l).size !== l.length) dup.push(`${k}/${wk}주`); });
  h += `<tr><td>변형해도 같은 날 운동이 겹치지 않음</td><td>6주 × 모든 코스 겹침 없음</td><td>${dup.join(', ') || '겹침 없음'}</td><td>${mark(!dup.length)}</td></tr>`;
  const subKeep = Logic.dayExercises('LB', 'intermediate', { leg_curl: 'rdl' }, {}, 1);
  h += `<tr><td>직접 대체한 운동은 번갈아 바꾸지 않음</td><td>레그 컬 → 내가 고른 운동 유지</td><td>${subKeep.map(id => EX[id].name).join(', ')}</td><td>${mark(!subKeep.includes('seated_leg_curl'))}</td></tr>`;
  document.getElementById('t-new').innerHTML = h;

  document.getElementById('summary').innerHTML = `<div class="notice ${pass === total ? 'info' : 'danger'}"><b>${total}개 중 ${pass}개 통과</b></div>`;
</script>
